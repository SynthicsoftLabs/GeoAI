name: continuous-validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: geoai-autonomous-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autonomous-repair:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run autonomous repair
        run: python scripts/autonomous_repair.py
      - name: Commit autonomous repairs
        run: |
          git config user.name "GeoAI Autonomous Agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No autonomous repair changes required."
          else
            git commit -m "chore: autonomous repository repair"
            git push origin HEAD:main
          fi

  validate:
    if: always() && (github.event_name == 'pull_request' || needs.autonomous-repair.result == 'success')
    needs: autonomous-repair
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repaired main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || 'main' }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Validate documentation
        run: python scripts/validate_docs.py
      - name: Run tests
        run: pytest -q
      - name: Run symbolic validation
        run: python -m geoai.validation

  package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: geoai-distributions
          path: dist/
          if-no-files-found: error
